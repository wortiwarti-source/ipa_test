
name: MOVE RESTORE - iOS IPA Build

on:
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-15

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Check Xcode
        run: xcodebuild -version

      - name: Build iOS App
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/DerivedData/Build/Products/Release-iphoneos/App.app Payload/
          zip -r -q MoveRestore.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MoveRestore-IPA
          path: MoveRestore.ipa
          if-no-files-found: error
          retention-days: 7
